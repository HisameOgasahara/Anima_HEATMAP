[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima-heatmap"
version = "0.1.0"
description = "Anima attention capture and spatial analysis, independent of ComfyUI"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.25", "Pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["anima_heatmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

